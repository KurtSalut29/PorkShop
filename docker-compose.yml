services:
  db:
    image: postgres:17-alpine
    container_name: porkshop-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: porkshop
      POSTGRES_PASSWORD: porkshop
      POSTGRES_DB: porkshop
      TZ: Asia/Manila
    ports:
      # 5433 on the host so it never collides with a locally installed PostgreSQL on 5432.
      - "5433:5432"
    volumes:
      - porkshop-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U porkshop -d porkshop"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  porkshop-data:
